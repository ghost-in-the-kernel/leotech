# Azure Pipelines: the audit job (audit/README.md). It has one test per item of the site's audit, and each test asks the
# site again. An item still open is skipped, "expected: still open". An item accepted as fixed passes. A surprise fails:
# an item seen FIXED and not yet accepted, an item open again after its accept, or a check that could not run. The run
# ends "N of M audit items fixed".
# A pipeline of its own (Pipelines > New > existing YAML: azure-audit.yml). It runs when a person starts it.
# BASE_URL is a pipeline variable.
# It runs in chromium and is never retried. It never runs on a push, a pull request, the nightly or the full run, and
# it is never a gate on a merge. A FIXED item waits for a person to run node menu/audit.mjs accept on a computer, from
# the run's result kept here.
trigger: none
pr: none
pool:
  vmImage: ubuntu-latest
jobs:
  - job: audit
    steps:
      - task: JavaToolInstaller@0
        inputs:
          versionSpec: '17'
          jdkArchitectureOption: x64
          jdkSourceOption: PreInstalled
      - script: mvn -B -q exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI "-Dexec.args=install --with-deps chromium"
      - script: mvn -B test -Dgroups=audit,rules -Dbrowser=chromium
      - task: PublishTestResults@2
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: 'target/surefire-reports/TEST-*.xml'
      - task: PublishPipelineArtifact@1
        condition: succeededOrFailed()
        inputs:
          targetPath: target/audit/
          artifact: audit
  # ==== YOURS (jobs): safe to edit; regenerating keeps what is between these lines ====
  # ==== END YOURS (jobs) ====
