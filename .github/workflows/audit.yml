# Generated by Suite Builder for https://leotechnologies.com. EDIT RULES: edit only inside YOURS blocks; regenerating keeps them and rewrites the rest of this file.
# GitHub Actions: the audit job (audit/README.md). It has one test per item of the site's audit, and each test asks the
# site again. An item still open is skipped, "expected: still open". An item accepted as fixed passes. A surprise fails:
# an item seen FIXED and not yet accepted, an item open again after its accept, or a check that could not run. The run
# ends "N of M audit items fixed".
# A person starts it (Actions > Audit > Run workflow).
# It runs in chromium and is never retried. It never runs on a push, a pull request, the nightly or the full run, and
# it is never a gate on a merge. A FIXED item waits for a person to run node menu/audit.mjs accept on a computer, from
# the run's result kept here.
name: Audit
on:
  workflow_dispatch:
# The least power that works: the repository read, nothing more.
permissions:
  contents: read
# One run at a time.
concurrency:
  group: audit
env:
  # ==== YOURS (env): safe to edit; regenerating keeps what is between these lines ====
  # Another copy of the site: a repository variable BASE_URL (Settings > Variables); unset, the crawled site.
  BASE_URL: ${{ vars.BASE_URL }}
  # ==== END YOURS (env) ====
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -q exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI "-Dexec.args=install --with-deps chromium"
      - run: mvn -B test -Dgroups=audit,rules -Dbrowser=chromium
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit
          if-no-files-found: ignore
          path: |
            target/surefire-reports/TEST-*.xml
            target/report.html
            target/audit/
